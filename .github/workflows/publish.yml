name: Publish to Modrinth & CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SableMaidRagdoll
        uses: actions/checkout@v4
        with:
          path: SableMaidRagdoll

      - name: Checkout SableRagdollLib
        uses: actions/checkout@v4
        with:
          repository: gly091020/SableRagdollLib
          path: SableRagdollLib

      - name: Checkout callresponse (Love-And-Loathe)
        uses: actions/checkout@v4
        with:
          repository: 1819919010-star/callresponse
          path: Love-And-Loathe

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Publish mod
        working-directory: SableMaidRagdoll
        run: |
          chmod +x gradlew
          VERSION_ARG=""
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION_ARG="-Pmod_version=${TAG#v}"
          fi
          ./gradlew publishMods $VERSION_ARG --stacktrace
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
